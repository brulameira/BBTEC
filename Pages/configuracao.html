<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuração | BBtec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estoque.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body>
  <div class="app">

    <aside class="menu" aria-label="Menu principal">
      <div class="menu-usuario">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
        </span>
        <div>
          <strong id="usuarioNome">Usuario</strong>
          <small id="usuarioEmail"></small>
        </div>
      </div>

      <nav>
        <ul>
          <li><a href="estoque.html">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
            Estoque</a></li>
          <li><a href="alertas.html">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 0 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>
            Alertas</a></li>
          <li><a href="relatorios.html">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
            Relatórios</a></li>
          <li><a href="configuracao.html" class="ativo" aria-current="page">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
            Configuração</a></li>
          <li><a href="perfil.html">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="12" cy="7.5" r="4.5"/><path d="M3.5 22c0-5 3.8-8 8.5-8s8.5 3 8.5 8z"/></svg>
            Perfil</a></li>
        </ul>
      </nav>

      <a href="login.html" class="sair">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M9 12h12M17 8l4 4-4 4"/></svg>
        SAIR</a>
    </aside>

    <main class="conteudo">
      <header class="topo">
        <div class="titulo">
          <h1>Configuração</h1>
          <p>Ajuste quando o sistema deve avisar você</p>
        </div>
        <a class="logo" href="../index.html" aria-label="BBtec - página inicial"><img src="../img/logo.png" alt="BBtec"></a>
      </header>

      <section class="painel-card" aria-labelledby="tAlertas">
        <h2 id="tAlertas">Alertas</h2>
        <p class="subtexto">Estas regras valem para os alertas, os números dos estoques e os relatórios.</p>

        <form id="formConfig" novalidate>
          <fieldset class="grupo">
            <legend>Estoque baixo</legend>
            <label class="opcao"><input type="checkbox" id="alertaEstoque"> <span>Avisar quando o estoque de um produto estiver baixo</span></label>
            <div class="campo">
              <label for="limite">Avisar quando a quantidade for igual ou menor que</label>
              <input type="number" id="limite" min="0" max="1000" step="1" inputmode="numeric">
              <p class="erro" id="erroLimite" role="alert" hidden></p>
            </div>
          </fieldset>

          <fieldset class="grupo">
            <legend>Validade</legend>
            <label class="opcao"><input type="checkbox" id="alertaValidade"> <span>Avisar sobre produtos vencidos ou perto de vencer</span></label>
            <div class="campo">
              <label for="dias">Avisar com quantos dias de antecedência</label>
              <input type="number" id="dias" min="0" max="365" step="1" inputmode="numeric">
              <p class="erro" id="erroDias" role="alert" hidden></p>
            </div>
          </fieldset>

          <div class="acoes-form">
            <button type="button" class="btn-sec" id="btnPadrao">Restaurar padrão</button>
            <button type="submit" class="btn-principal">Salvar configurações</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script type="module" src="../js/configuracao.js"></script>
</body>
</html>
