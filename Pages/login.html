<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css">
    
</head>
<body>
    <div class="topo">
        <header id="Logo">
            <img src="img/logo.png" alt="Logo BBtech">
        </header>
    </div>

    <div class="container">
        <aside class="esquerda">
            <div class="texto">
                <h1 >Bem-Vindo a BBtech </h1>
            
                <p>Organize seus estoques forma simples e eficiente </p>
            </div>
            <div class="caixa">
                <img src="img/caixa.png" alt="">

            </div>
        </aside>
        
    
        <main class="direita">
            <h2>Acesso sua conta</h2>
            <form id="form">
                <div class="campo">
                    <img src="img/email.svg" alt="">
                    <label for="email" class="escondido">Email:</label>
                    <input type="email" name="" id="email" placeholder="Email">
                </div>
                <div class="campo">
                    <img src="img/senha.svg" alt="">
                    <label for="senha" class="escondido">Senha:</label>
                    <input type="password" name="" id="senha" placeholder="Senha">
                </div>
                <button type="submit" class="btn-entrar">Entrar</button>

            </form>
            <a href="#" class="link-senha">Esqueceu sua senha?</a>
            
        </main>
    </div>
