<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBtec — Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
<header>
  <nav class="nav" aria-label="Principal">
    <a href="index.html" aria-label="BBtec"><img src="../img/logo.png" alt="BBtec"></a>

    <a  type="module" href="../index.html" aria-label="BBtec"><img src="../img/logo.png" alt="BBtec"></a>
    <div class="links">
      <a  type="module" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg><span class="txt-inicio">Início</span></a>
      <a  type="module" href="../index.html#contatos">Contatos</a>
    </div>
    <a class="btn btn-azul" href="login.html">Login</a>
  </nav>
</header>
<main class="auth">
  <div class="auth-card">
    <section class="painel" aria-label="Boas-vindas">
      <div>
        <h1>Bem-vindo ao BBtec!</h1>
        <p>Crie sua conta e organize seus estoques de forma simples e eficiente.</p>
      </div>
      <svg class="caixa" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 56 18v28L32 58 8 46V18z"/><path d="M8 18l24 12 24-12M32 30v28"/></svg>
    </section>
    <section class="form-area">
      <h2>Crie sua conta</h2>
      <p class="sub">Leva menos de um minuto.</p>
      <form id="form-cadastro" novalidate>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <div class="entrada"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input id="nome" name="nome" type="text" placeholder="Seu nome" autocomplete="name" aria-describedby="erro-nome"></div>
          <p class="erro" id="erro-nome" role="alert" hidden></p>
        </div>
        <div class="linha">
        <div class="campo">
          <label for="empresa">Empresa <span class="opc">(opcional)</span></label>
          <div class="entrada"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/></svg><input id="empresa" name="empresa" type="text" placeholder="Sua empresa" autocomplete="organization"></div>
        </div>
        <div class="campo">
          <label for="cargo">Cargo <span class="opc">(opcional)</span></label>
          <div class="entrada"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><input id="cargo" name="cargo" type="text" placeholder="Sua função" autocomplete="organization-title"></div>
        </div>
      </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <div class="entrada"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" name="email" type="email" placeholder="nome@empresa.com" autocomplete="email" aria-describedby="erro-email"></div>
          <p class="erro" id="erro-email" role="alert" hidden></p>
        </div>
        <div class="linha">
          <div class="campo">
            <label for="senha">Senha</label>
            <div class="entrada com-olho"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="senha" name="senha" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" aria-describedby="erro-senha"><button class="olho" type="button" data-alvo="senha" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            <p class="erro" id="erro-senha" role="alert" hidden></p>
            <div class="forca" id="forca"><div class="barras"><i></i><i></i><i></i></div><small aria-live="polite"></small></div>
          </div>
          <div class="campo">
            <label for="confirmar">Confirmar senha</label>
            <div class="entrada com-olho"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="confirmar" name="confirmar" type="password" placeholder="Repita a senha" autocomplete="new-password" aria-describedby="erro-confirmar"><button class="olho" type="button" data-alvo="confirmar" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            <p class="erro" id="erro-confirmar" role="alert" hidden></p>
          </div>
        </div>
        <label class="termos"><input type="checkbox" id="termos" name="termos" aria-describedby="erro-termos"><span>Li e aceito os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a>.</span></label>
        <p class="erro" id="erro-termos" role="alert" hidden></p>
        <button class="btn btn-azul enviar" type="submit">Cadastrar</button>
        <p class="ou">ou</p>

        <button type="button" class="btn-google" id="btn-google">
          <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Cadastrar com o Google
        </button>
        
<p class="erro" id="erro-google" role="alert" hidden></p>
        <div class="sucesso" id="sucesso" role="status" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.4 14.4-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4z"/></svg><span>Cadastro realizado com sucesso! (demonstração: nenhum dado foi enviado)</span></div>
      </form>
      <p class="troca">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
  </div>
</main>
<script src="../js/cadastro.js"></script>
<script type="module" src="../js/cadastro.js"></script>
</body>
</html>
